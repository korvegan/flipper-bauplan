<script>
(async()=>{
const c=document.querySelector('#c'),msg=document.querySelector('#msg'),gl=c.getContext('webgl',{antialias:true,alpha:true});

const V='attribute vec3 pos,nor;attribute vec4 col; uniform vec3 right,up,eye,focus; uniform vec2 scale; varying vec3 tone; void main(){vec3 d=pos-focus; gl_Position=vec4(dot(d,right)*scale.x,dot(d,up)*scale.y,-dot(d,eye)*0.25,1.0); vec3 n=dot(nor,eye)<0.?-nor:nor; tone=col.rgb*(0.80+0.30*max(dot(n,vec3(-0.35,0.85,0.4)),0.));}';

const packed=Uint8Array.from(atob(document.querySelector('#data').textContent.trim()),x=>x.charCodeAt(0));

function change(i){view=i;az=i===0?.57:0;el=i===0?.36:i===1?1.49:.91;cy=i===0?.79:i===1?.92:.91;cz=i===2?.30:0;zoom=1;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.view===view)));draw();}
